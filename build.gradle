import com.github.jk1.license.render.TextReportRenderer

plugins {
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT' apply false
    id 'com.github.jk1.dependency-license-report' version '2.9'
    id 'com.gradleup.nmcp.aggregation' version '1.6.1'
    id 'java'
}

repositories {
    mavenCentral()
}

licenseReport {
    renderers = [new TextReportRenderer('ThirdPartyNotices.txt')]
}

allprojects {
    apply plugin: 'java'

    group = project.group
    version = project.version

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(14)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

nmcpAggregation {
    centralPortal {
        username = providers.environmentVariable('CENTRAL_PORTAL_USERNAME')
                .getOrElse('')
        password = providers.environmentVariable('CENTRAL_PORTAL_PASSWORD')
                .getOrElse('')

        publishingType = 'USER_MANAGED'
        publicationName = "cn.opanel:opanel-api:${version}"
    }
}

dependencies {
    nmcpAggregation project(':api')
}
