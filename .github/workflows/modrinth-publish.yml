name: Publish to Modrinth

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: modrinth-publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:

    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.prepare_matrix.outputs.matrix }}
      release_body: ${{ steps.release_info.outputs.body }}

    steps:
    - uses: actions/checkout@v6

    - name: Get latest release
      uses: easyware-io/get-latest-release@v1
      id: release_info
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Download release assets
      uses: robinraju/release-downloader@v1
      with:
        repository: "opanel-mc/opanel"
        tag: ${{ steps.release_info.outputs.tag_name }}
        fileName: "*.jar"
        tarBall: false
        zipBall: false
        out-file-path: "${{ github.workspace }}/release-jars"

    - name: Prepare publishing matrix
      id: prepare_matrix
      run: node .github/scripts/prepare-modrinth-matrix.mjs
      env:
        RELEASE_ASSETS_DIR: ${{ github.workspace }}/release-jars
        RELEASE_NAME: ${{ steps.release_info.outputs.name }}
        RELEASE_PRERELEASE: ${{ steps.release_info.outputs.prerelease }}
        RELEASE_REPOSITORY: ${{ github.repository }}
        RELEASE_TAG: ${{ steps.release_info.outputs.tag_name }}
        SUPPORTED_VERSION_LIST_URL: https://dist.opanel.cn/supported-version-list.json

  publish:

    name: Publish ${{ matrix.platform }} ${{ matrix.buildVersion }}
    needs: prepare
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
    - name: Check existing Modrinth version
      id: existing_version
      uses: actions/github-script@v9
      env:
        ASSET_NAME: ${{ matrix.asset }}
        ASSET_SHA512: ${{ matrix.sha512 }}
        MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_ID }}
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        MODRINTH_VERSION_NUMBER: ${{ matrix.versionNumber }}
      with:
        script: |
          const project = process.env.MODRINTH_PROJECT_ID;
          const version = process.env.MODRINTH_VERSION_NUMBER;
          if(!project || !version) {
            core.setFailed("MODRINTH_PROJECT_ID and MODRINTH_VERSION_NUMBER are required.");
            return;
          }

          const url = `https://api.modrinth.com/v2/project/${encodeURIComponent(project)}/version/${encodeURIComponent(version)}`;
          const response = await fetch(url, {
            headers: { Authorization: process.env.MODRINTH_TOKEN },
          });

          if(response.status === 404) {
            core.setOutput("publish", "true");
            return;
          }

          if(!response.ok) {
            core.setFailed(`Unable to check Modrinth version ${version}: HTTP ${response.status}`);
            return;
          }

          const existing = await response.json();
          const file = existing.files.find(({ filename }) => filename === process.env.ASSET_NAME);
          if(file?.hashes?.sha512 === process.env.ASSET_SHA512) {
            core.info(`Modrinth version ${version} already contains the same file; skipping it.`);
            core.setOutput("publish", "false");
            return;
          }

          core.setFailed(`Modrinth version ${version} already exists with a different file.`);

    - name: Create version and upload file
      if: steps.existing_version.outputs.publish == 'true'
      uses: cloudnode-pro/modrinth-publish@v2
      with:
        token: ${{ secrets.MODRINTH_TOKEN }}
        project: ${{ vars.MODRINTH_ID }}
        name: ${{ matrix.versionName }}
        version: ${{ matrix.versionNumber }}
        channel: ${{ matrix.channel }}
        changelog: ${{ needs.prepare.outputs.release_body }}
        loaders: ${{ matrix.loader }}
        game-versions: ${{ matrix.gameVersions }}
        files: ${{ matrix.downloadUrl }}
        primary-file: ${{ matrix.asset }}
        environment: dedicated_server_only
