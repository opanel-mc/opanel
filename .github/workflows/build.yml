name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  frontend:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json
    - run: npm i
    - run: npm run prelaunch
    
    - name: Run lint
      run: npm run lint

    - name: Run unit tests
      run: npm run test
    
    - name: Run wasm unit tests
      run: npm run wasm:test
    
    - name: Test building frontend
      run: npm run build

  jar:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [25]
        gradle-version: [9.3.0]

    steps:
    - name: Remove unnecessary files to release disk space
      run: |
        df -h
        rm -rf /opt/hostedtoolcache
        df -h

    - uses: actions/checkout@v4
    - name: Use JDK 25, 21, 17, 14
      uses: actions/setup-java@v4
      with:
        java-version: |
          25
          21
          17
          14
        distribution: "zulu"
        cache: "gradle"
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json
    - name: Change wrapper permissions
      run: chmod +x ./gradlew

    - run: cd frontend && npm i
    - name: Build and bundle frontend
      run: cd frontend && npm run build:pack

    - name: Building jar files
      run: JAVA_HOME=$JAVA_HOME_25_X64 ./gradlew build --stacktrace
    - name: Upload individual jar artifacts
      run: |
        npm install --prefix /tmp/artifact-uploader @actions/artifact --silent
        node << 'SCRIPT'
        const { DefaultArtifactClient } = require('/tmp/artifact-uploader/node_modules/@actions/artifact');
        const fs = require('fs');
        const path = require('path');
        (async () => {
          const client = new DefaultArtifactClient();
          const libsDir = path.resolve('build/libs');
          const jars = fs.readdirSync(libsDir)
            .filter(f => /^opanel-.*-build.*\.jar$/.test(f))
            .sort();
          console.log(`Uploading ${jars.length} jars individually...`);
          for (const jar of jars) {
            const name = path.basename(jar, '.jar');
            process.stdout.write(`  ${name} ... `);
            await client.uploadArtifact(name, [path.join(libsDir, jar)], libsDir);
            console.log('done');
          }
        })().catch(e => { console.error(e); process.exit(1); });
        SCRIPT