name: Build

on:
  workflow_dispatch:
    inputs:
      build_jar:
        description: Build jar files
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
    paths-ignore:
      - ".agents/**"
      - ".claude/**"
      - ".idea/**"
      - ".vscode/**"
      - "gradle/**"
      - "images/**"
      - ".gitattributes"
      - ".gitignore"
      - "**/*.md"
      - "LICENSE"
      - "ThirdPartyNotices.txt"
  pull_request:
    paths-ignore:
      - ".agents/**"
      - ".claude/**"
      - ".idea/**"
      - ".vscode/**"
      - "gradle/**"
      - "images/**"
      - ".gitattributes"
      - ".gitignore"
      - "**/*.md"
      - "LICENSE"
      - "ThirdPartyNotices.txt"

jobs:
  frontend:

    runs-on: ubuntu-latest

    outputs:
      jar_required: ${{ steps.changes.outputs.jar_required }}

    strategy:
      matrix:
        node-version: [22.x]
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Determine whether jar build is required
      id: changes
      working-directory: .
      env:
        EVENT_NAME: ${{ github.event_name }}
        BUILD_JAR: ${{ inputs.build_jar }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.sha }}
      run: |
        if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
          echo "jar_required=$BUILD_JAR" >> "$GITHUB_OUTPUT"
        elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
          echo "jar_required=true" >> "$GITHUB_OUTPUT"
        else
          changed_files=$(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" -- . ':(exclude)frontend/**')
          if [[ -n "$changed_files" ]]; then
            echo "jar_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "jar_required=false" >> "$GITHUB_OUTPUT"
          fi
        fi
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json
    - name: Install dependencies
      run: npm i
    - name: Run prelaunch scripts
      run: npm run prelaunch
    
    - name: Run lint
      run: npm run lint

    - name: Run unit tests
      run: npm run test
    
    - name: Run wasm unit tests
      run: npm run wasm:test

    - name: Build and bundle frontend
      run: npm run build:pack
    - name: Upload bundled frontend
      if: steps.changes.outputs.jar_required == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: frontend-build
        path: core/src/main/resources/web
        if-no-files-found: error

  jar:

    needs: frontend
    if: needs.frontend.outputs.jar_required == 'true'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [25]
        gradle-version: [9.3.0]

    steps:
    - name: Remove unnecessary files to release disk space
      run: |
        df -h
        rm -rf /opt/hostedtoolcache
        df -h

    - uses: actions/checkout@v6
    - name: Use JDK 25, 21, 17, 14
      uses: actions/setup-java@v5
      with:
        java-version: |
          25
          21
          17
          14
        distribution: "zulu"
        cache: "gradle"
    - name: Change wrapper permissions
      run: chmod +x ./gradlew

    - name: Remove bundled frontend from checkout
      run: rm -rf ./core/src/main/resources/web
    - name: Download frontend build
      uses: actions/download-artifact@v8
      with:
        name: frontend-build
        path: core/src/main/resources/web

    - name: Build jar files
      run: JAVA_HOME=$JAVA_HOME_25_X64 ./gradlew build --stacktrace

    - name: Expose Actions runtime token
      uses: actions/github-script@v9
      with:
        script: |
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN)
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL)
    - name: Upload jar files
      working-directory: .github/scripts
      run: |
        npm init -y >/dev/null
        npm i @actions/artifact@^2
        node upload-jars.mjs
