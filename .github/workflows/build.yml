name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  frontend:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json
    - run: npm i
    - run: npm run prelaunch
    
    - name: Run lint
      run: npm run lint

    - name: Run unit tests
      run: npm run test
    
    - name: Run wasm unit tests
      run: npm run wasm:test

  jar:

    runs-on: ubuntu-latest

    outputs:
      jars: ${{ steps.list-jars.outputs.jars }}

    strategy:
      matrix:
        java-version: [25]
        gradle-version: [9.3.0]
        node-version: [22.x]

    steps:
    - name: Remove unnecessary files to release disk space
      run: |
        df -h
        rm -rf /opt/hostedtoolcache
        df -h

    - uses: actions/checkout@v6
    - name: Use JDK 25, 21, 17, 14
      uses: actions/setup-java@v5
      with:
        java-version: |
          25
          21
          17
          14
        distribution: "zulu"
        cache: "gradle"
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json
    - name: Change wrapper permissions
      run: chmod +x ./gradlew

    - run: cd frontend && npm i
    - name: Build and bundle frontend
      run: cd frontend && npm run build:pack

    - name: Building jar files
      run: JAVA_HOME=$JAVA_HOME_25_X64 ./gradlew build --stacktrace

    - name: Collect jar list
      id: list-jars
      run: |
        jars=$(cd build/libs && ls *.jar | jq -R -s -c 'split("\n") | map(select(length > 0))')
        echo "jars=$jars" >> "$GITHUB_OUTPUT"

    - name: Upload jars (transport)
      uses: actions/upload-artifact@v7
      with:
        name: opanel-jars-all
        path: ./build/libs/*
        retention-days: 1

  upload-jars:

    needs: jar
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        jar: ${{ fromJSON(needs.jar.outputs.jars) }}

    steps:
    - name: Download built jars
      uses: actions/download-artifact@v8
      with:
        name: opanel-jars-all
        path: ./libs

    - name: Upload ${{ matrix.jar }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.jar }}
        path: ./libs/${{ matrix.jar }}
