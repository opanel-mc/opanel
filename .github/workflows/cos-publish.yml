name: Publish to COS

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: cos-publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release jars to COS
    runs-on: ubuntu-latest
    environment: opanel-dist

    steps:
    - uses: actions/checkout@v6

    - name: Get latest release
      uses: easyware-io/get-latest-release@v1
      id: release_info
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Download release assets
      uses: robinraju/release-downloader@v1
      with:
        repository: "opanel-mc/opanel"
        tag: ${{ steps.release_info.outputs.tag_name }}
        fileName: "*.jar"
        tarBall: false
        zipBall: false
        out-file-path: "${{ github.workspace }}/release-jars"
    
    - name: Install COSCLI
      env:
        COSCLI_VERSION: v1.0.8
        COSCLI_SHA256: 7165f2ae16c5f7ac495864c963ca574a76e04ec72680d7bc8a8eee3234d8cf91
      run: |
        curl --fail --location --show-error \
          --output "$RUNNER_TEMP/coscli" \
          "https://github.com/tencentyun/coscli/releases/download/${COSCLI_VERSION}/coscli-${COSCLI_VERSION}-linux-amd64"
        echo "${COSCLI_SHA256}  $RUNNER_TEMP/coscli" | sha256sum --check -
        chmod 755 "$RUNNER_TEMP/coscli"
        "$RUNNER_TEMP/coscli" --version

    - name: Upload to COS
      env:
        COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
        COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        COS_BUCKET: ${{ vars.COS_BUCKET }}
        COS_REGION: ${{ vars.COS_REGION }}
        LOCAL_PATH: ${{ github.workspace }}/release-jars
        REMOTE_PATH: ${{ steps.release_info.outputs.tag_name }}
      run: |
        set -euo pipefail

        : "${COS_SECRET_ID:?Missing COS_SECRET_ID secret}"
        : "${COS_SECRET_KEY:?Missing COS_SECRET_KEY secret}"
        : "${COS_BUCKET:?Missing COS_BUCKET variable}"
        : "${COS_REGION:?Missing COS_REGION variable}"
        : "${REMOTE_PATH:?Missing release tag}"

        "$RUNNER_TEMP/coscli" sync \
          "$LOCAL_PATH/" \
          "cos://${COS_BUCKET}/${REMOTE_PATH}/" \
          --secret-id "$COS_SECRET_ID" \
          --secret-key "$COS_SECRET_KEY" \
          --endpoint "cos.${COS_REGION}.myqcloud.com" \
          --init-skip \
          --recursive \
          --delete \
          --force \
          --fail-output-path "$RUNNER_TEMP/coscli-output" \
          --process-log-path "$RUNNER_TEMP/coscli-output"
