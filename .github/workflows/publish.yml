name: Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish
        required: true
        type: string
      prerelease:
        description: Mark as prerelease
        required: false
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  jar:
    runs-on: ubuntu-latest

    steps:
    - name: Remove unnecessary files to release disk space
      run: |
        df -h
        rm -rf /opt/hostedtoolcache
        df -h

    - uses: actions/checkout@v6

    - name: Use Node.js 22.x
      uses: actions/setup-node@v6
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json

    - name: Use JDK 25, 21, 17, 14
      uses: actions/setup-java@v5
      with:
        java-version: |
          25
          21
          17
          14
        distribution: "zulu"
        cache: "gradle"

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm i

    - name: Build and bundle frontend
      working-directory: ./frontend
      run: npm run build:pack

    - name: Change wrapper permissions
      run: chmod +x ./gradlew

    - name: Build jar files
      run: JAVA_HOME=$JAVA_HOME_25_X64 ./gradlew build --stacktrace

    - name: Upload jar files
      uses: actions/upload-artifact@v7
      with:
        name: jar-files
        path: build/libs/*.jar
        if-no-files-found: error

  prepare-cos:
    needs: jar
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.prepare_matrix.outputs.matrix }}

    steps:
    - uses: actions/checkout@v6

    - name: Download jar files
      uses: actions/download-artifact@v8
      with:
        name: jar-files
        path: build/libs

    - name: Prepare publishing matrix
      id: prepare_matrix
      run: node .github/scripts/prepare-cos-matrix.mjs
      env:
        RELEASE_ASSETS_DIR: ${{ github.workspace }}/build/libs
        RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

  publish-cos:
    name: Upload ${{ matrix.asset }}
    needs: prepare-cos
    runs-on: ubuntu-latest
    environment: opanel-dist

    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.prepare-cos.outputs.matrix) }}

    steps:
    - name: Download jar files
      uses: actions/download-artifact@v8
      with:
        name: jar-files
        path: build/libs

    - name: Install COSCLI
      env:
        COSCLI_VERSION: v1.0.8
        COSCLI_SHA256: 7165f2ae16c5f7ac495864c963ca574a76e04ec72680d7bc8a8eee3234d8cf91
      run: |
        curl --fail --location --show-error \
          --output "$RUNNER_TEMP/coscli" \
          "https://github.com/tencentyun/coscli/releases/download/${COSCLI_VERSION}/coscli-${COSCLI_VERSION}-linux-amd64"
        echo "${COSCLI_SHA256}  $RUNNER_TEMP/coscli" | sha256sum --check -
        chmod 755 "$RUNNER_TEMP/coscli"
        "$RUNNER_TEMP/coscli" --version

    - name: Upload to COS
      env:
        COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
        COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        COS_BUCKET: ${{ vars.COS_BUCKET }}
        COS_REGION: ${{ vars.COS_REGION }}
        ASSET_NAME: ${{ matrix.asset }}
        REMOTE_PATH: ${{ github.event.release.tag_name || inputs.release_tag }}
      run: |
        set -euo pipefail

        : "${COS_SECRET_ID:?Missing COS_SECRET_ID secret}"
        : "${COS_SECRET_KEY:?Missing COS_SECRET_KEY secret}"
        : "${COS_BUCKET:?Missing COS_BUCKET variable}"
        : "${COS_REGION:?Missing COS_REGION variable}"
        : "${ASSET_NAME:?Missing release asset name}"
        : "${REMOTE_PATH:?Missing release tag}"

        "$RUNNER_TEMP/coscli" cp \
          "build/libs/${ASSET_NAME}" \
          "cos://${COS_BUCKET}/${REMOTE_PATH}/${ASSET_NAME}" \
          --secret-id "$COS_SECRET_ID" \
          --secret-key "$COS_SECRET_KEY" \
          --endpoint "cos.${COS_REGION}.myqcloud.com" \
          --init-skip \
          --part-size 1 \
          --thread-num 8 \
          --check-point=true \
          --fail-output-path "$RUNNER_TEMP/coscli-output" \
          --process-log-path "$RUNNER_TEMP/coscli-output"

  prepare-modrinth:
    needs: jar
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.prepare_matrix.outputs.matrix }}

    steps:
    - uses: actions/checkout@v6

    - name: Download jar files
      uses: actions/download-artifact@v8
      with:
        name: jar-files
        path: build/libs

    - name: Prepare publishing matrix
      id: prepare_matrix
      run: node .github/scripts/prepare-modrinth-matrix.mjs
      env:
        RELEASE_ASSETS_DIR: ${{ github.workspace }}/build/libs
        RELEASE_NAME: ${{ github.event.release.name || inputs.release_tag }}
        RELEASE_PRERELEASE: ${{ github.event.release.prerelease || inputs.prerelease }}
        RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        SUPPORTED_VERSION_LIST_URL: https://dist.opanel.cn/supported-version-list.json

  publish-modrinth:
    name: Publish ${{ matrix.platform }} ${{ matrix.buildVersion }}
    needs: prepare-modrinth
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare-modrinth.outputs.matrix) }}

    steps:
    - name: Download jar files
      uses: actions/download-artifact@v8
      with:
        name: jar-files
        path: build/libs

    - name: Check existing Modrinth version
      id: existing_version
      uses: actions/github-script@v9
      env:
        ASSET_NAME: ${{ matrix.asset }}
        ASSET_SHA512: ${{ matrix.sha512 }}
        MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_ID }}
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        MODRINTH_VERSION_NUMBER: ${{ matrix.versionNumber }}
      with:
        script: |
          const project = process.env.MODRINTH_PROJECT_ID;
          const version = process.env.MODRINTH_VERSION_NUMBER;
          if(!project || !version) {
            core.setFailed("MODRINTH_PROJECT_ID and MODRINTH_VERSION_NUMBER are required.");
            return;
          }

          const url = `https://api.modrinth.com/v2/project/${encodeURIComponent(project)}/version/${encodeURIComponent(version)}`;
          const response = await fetch(url, {
            headers: { Authorization: process.env.MODRINTH_TOKEN },
          });

          if(response.status === 404) {
            core.setOutput("publish", "true");
            return;
          }

          if(!response.ok) {
            core.setFailed(`Unable to check Modrinth version ${version}: HTTP ${response.status}`);
            return;
          }

          const existing = await response.json();
          const file = existing.files.find(({ filename }) => filename === process.env.ASSET_NAME);
          if(file?.hashes?.sha512 === process.env.ASSET_SHA512) {
            core.info(`Modrinth version ${version} already contains the same file; skipping it.`);
            core.setOutput("publish", "false");
            return;
          }

          core.setFailed(`Modrinth version ${version} already exists with a different file.`);

    - name: Create version and upload file
      if: steps.existing_version.outputs.publish == 'true'
      uses: cloudnode-pro/modrinth-publish@v2
      with:
        token: ${{ secrets.MODRINTH_TOKEN }}
        project: ${{ vars.MODRINTH_ID }}
        name: ${{ matrix.versionName }}
        version: ${{ matrix.versionNumber }}
        channel: ${{ matrix.channel }}
        changelog: ${{ github.event.release.body || '' }}
        loaders: ${{ matrix.loader }}
        game-versions: ${{ matrix.gameVersions }}
        files: build/libs/${{ matrix.asset }}
        primary-file: ${{ matrix.asset }}
        environment: dedicated_server_only

