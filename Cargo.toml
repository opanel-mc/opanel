[package]
name = "opanel-pumpkin"
version = "2.2.4"
edition = "2024"
description = "A Minecraft server management panel"
authors = ["NriotHrreion"]

[lib]
path = "pumpkin/lib.rs"
crate-type = ["cdylib"]

[workspace]
members = ["pumpkin/assets"]
exclude = ["frontend/wasm-lib"]
resolver = "3"

[dependencies]
arc-swap = "1"
axum = { version = "0.8", features = ["http1", "json", "multipart", "tokio", "ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
flate2 = "1"
futures-util = "0.3"
getrandom = "0.3"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff"] }
md5 = "0.8"
mime_guess = "2"
opanel-pumpkin-assets = { path = "pumpkin/assets" }
percent-encoding = "2"
pumpkin = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", tag = "0.2.0+26.3-26.51", package = "pumpkin" }
pumpkin-api-macros = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", tag = "0.2.0+26.3-26.51", package = "pumpkin-api-macros" }
pumpkin-config = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", tag = "0.2.0+26.3-26.51", package = "pumpkin-config" }
pumpkin-data = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", tag = "0.2.0+26.3-26.51", package = "pumpkin-data" }
pumpkin-nbt = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", tag = "0.2.0+26.3-26.51", package = "pumpkin-nbt" }
pumpkin-util = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", tag = "0.2.0+26.3-26.51", package = "pumpkin-util" }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
sysinfo = { version = "0.39", default-features = false, features = ["system", "network", "disk"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
toml_edit = "0.25"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde"] }
zip = { version = "6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio-tungstenite = "0.29"

# Pumpkin's debug rlib exceeds MSVC's 4 GiB COFF archive limit when full debug
# information is enabled. OPanel itself keeps the normal dev profile.
[profile.dev.package.pumpkin]
debug = 0
