pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}


plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'opanel'

def apiOnly = providers.gradleProperty('apiOnly')
    .map { it.toBoolean() }
    .getOrElse(false)

include 'api'

if (!apiOnly) {
    include 'core'

    def platformModules = new groovy.json.JsonSlurper().parse(file('platform-modules.json'))
    def buildTarget = providers.gradleProperty('buildTarget').orNull
    def targets = platformModules.values().collectMany { it.keySet() }
    if (buildTarget != null && !targets.contains(buildTarget)) {
        throw new GradleException('Unknown buildTarget: ' + buildTarget)
    }

    platformModules.each { platform, modules ->
        def includedModules = new LinkedHashSet<String>()
        modules.each { target, helpers ->
            if (buildTarget == null || target == buildTarget) {
                includedModules.addAll(helpers)
                includedModules.add(target)
            }
        }
        includedModules.each { module ->
            include module
            project(':' + module).projectDir = file(platform + '/' + module)
        }
    }

    if (buildTarget == null) include 'example-extension'
}
